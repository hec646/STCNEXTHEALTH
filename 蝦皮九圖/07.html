<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><link rel="stylesheet" href="../cards.css"></head><body><article class="art"><div class="main"><div class="eyebrow">HOW TO USE</div><h1>精華保養<br>三步驟</h1><div class="sub">依日常習慣，搭配肌膚需要。</div></div><div class="rows" style="top:610px"><div><b>01</b><p>臉部清潔後，使用化妝水。</p></div><div><b>02</b><p>取適量精華塗抹，輕柔按摩至吸收。</p></div><div><b>03</b><p>依需要搭配乳液或乳霜。</p></div></div><div class="foot">首次使用前先局部試用；如有不適，請停止使用。</div><img class="logo" src="../assets/logo.png"><span class="sectionnum">07 / STC NEXTHEALTH</span></article></body></html>
